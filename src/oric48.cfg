# oric48.cfg - ld65 config, Oric-1 / Atmos 48K without ROM calls
# (docs/ARCHITECTURE.md D1, D9).  Program $0500..$97FF less the C stack;
# charset $9800-$9FFF, HIRES $A000-$BF3F, text rows $BF68-$BFDF,
# harness debug port $BFE0-$BFE3 (tools/README.md).
FEATURES {
    STARTADDRESS: default = $0500;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0200;   # cc65 C (parameter) stack
    __PROGTOP__:   type = weak, value = $9800;   # first byte not ours (charset)
}
MEMORY {
    ZP:   file = "", define = yes, start = $0002, size = $00FE;
    MAIN: file = %O, define = yes, start = %S,
          size = __PROGTOP__ - __STACKSIZE__ - %S;
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro, optional = yes;
    ONCE:     load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
}
